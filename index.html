<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVault — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050a12;--panel:#0b1220;--border:#1a2a40;--accent:#00aaff;--accent2:#0066cc;--text:#c8d8e8;--muted:#4a6080;--error:#ff4060}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,170,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,170,255,0.03) 1px,transparent 1px);background-size:40px 40px;animation:gridMove 20s linear infinite;pointer-events:none}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(0,100,200,0.08) 0%,transparent 70%);pointer-events:none}
@keyframes gridMove{0%{transform:translateY(0)}100%{transform:translateY(40px)}}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;background:var(--accent);border-radius:50%;opacity:0;animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh);opacity:0}10%{opacity:.6}90%{opacity:.2}100%{transform:translateY(-10vh);opacity:0}}
.container{position:relative;z-index:10;width:100%;max-width:420px;padding:20px;animation:fadeIn .8s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{width:56px;height:56px;margin:0 auto 12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,170,255,.4)}
.logo-icon::before{content:'◈';font-size:28px;color:#fff}
.logo h1{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#fff}
.logo h1 span{color:var(--accent)}
.logo p{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:36px 32px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6}
.card-title{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:28px;text-align:center}
.form-group{margin-bottom:20px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
input[type="text"],input[type="email"],input[type="password"]{width:100%;padding:13px 14px 13px 42px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;color:#fff;font-family:'Exo 2',sans-serif;font-size:14px;outline:none;transition:border-color .3s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,170,255,.1)}
input::placeholder{color:var(--muted)}
.toggle-pass{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
.toggle-pass:hover{color:var(--accent)}
.options{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.remember{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--muted)}
.remember input{width:14px;height:14px;accent-color:var(--accent)}
.forgot{font-size:12px;color:var(--accent);text-decoration:none}
.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:transform .2s,box-shadow .3s;box-shadow:0 4px 20px rgba(0,170,255,.3)}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 30px rgba(0,170,255,.5)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.register{text-align:center;font-size:13px;color:var(--muted)}
.register a{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
.status-bar{display:flex;align-items:center;gap:8px;margin-top:24px;padding:10px 14px;background:rgba(0,255,100,.05);border:1px solid rgba(0,255,100,.1);border-radius:6px;font-size:11px;letter-spacing:1px;color:#00cc66}
.status-dot{width:6px;height:6px;background:#00cc66;border-radius:50%;animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px #00cc66}50%{opacity:.4}}
.error-msg{display:none;padding:10px 14px;background:rgba(255,64,96,.08);border:1px solid rgba(255,64,96,.2);border-radius:6px;font-size:12px;color:var(--error);margin-bottom:16px}
.success-msg{display:none;padding:10px 14px;background:rgba(0,255,170,.08);border:1px solid rgba(0,255,170,.2);border-radius:6px;font-size:12px;color:#00ffaa;margin-bottom:16px}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="container">
  <div class="logo">
    <div class="logo-icon"></div>
    <h1>Game<span>Vault</span></h1>
    <p>Plateforme de jeux</p>
  </div>
  <div class="card">
    <div class="card-title">Connexion</div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="votre@email.com" autocomplete="username">
          <span class="input-icon">✉️</span>
        </div>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <span class="input-icon">🔒</span>
          <button type="button" class="toggle-pass" onclick="togglePassword()">👁</button>
        </div>
      </div>
      <div class="options">
        <label class="remember"><input type="checkbox" id="remember"> Se souvenir de moi</label>
        <a href="#" class="forgot">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="btn-submit" id="btnLogin">Se connecter</button>
    </form>
    <div class="divider"><span>ou</span></div>
    <div class="register">Pas encore de compte ? <a onclick="window.location='accounts.html'">Créer un compte</a></div>
    <div class="status-bar">
      <div class="status-dot"></div>
      Mode localStorage — aucune connexion serveur requise
    </div>
  </div>
</div>
<script>
// ── Particules
const c = document.getElementById('particles');
for (let i = 0; i < 25; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDuration = (8 + Math.random() * 15) + 's';
  p.style.animationDelay = (Math.random() * 10) + 's';
  p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
  c.appendChild(p);
}

// ── Init : créer le compte admin par défaut si aucun compte
function initComptes() {
  let comptes = JSON.parse(localStorage.getItem('gv_comptes') || '[]');
  if (comptes.length === 0) {
    comptes.push({
      id: 'admin-1',
      name: 'Administrateur',
      email: 'admin@gamevault.com',
      password: 'admin123',
      role: 'admin',
      games: 0,
      date: new Date().toLocaleDateString('fr-FR')
    });
    localStorage.setItem('gv_comptes', JSON.stringify(comptes));
  }
  if (!localStorage.getItem('gv_jeux')) localStorage.setItem('gv_jeux', '[]');
}
initComptes();

// ── Toggle password
function togglePassword() {
  const i = document.getElementById('password');
  i.type = i.type === 'password' ? 'text' : 'password';
}

// ── Login
document.getElementById('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pw = document.getElementById('password').value;
  const err = document.getElementById('errorMsg');
  const ok = document.getElementById('successMsg');
  const btn = document.getElementById('btnLogin');
  err.style.display = 'none';
  ok.style.display = 'none';

  if (!email || !pw) {
    err.textContent = '⚠ Remplissez tous les champs.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Connexion...';

  setTimeout(() => {
    const comptes = JSON.parse(localStorage.getItem('gv_comptes') || '[]');
    const user = comptes.find(c => c.email.toLowerCase() === email && c.password === pw);
    if (user) {
      sessionStorage.setItem('gv_session', JSON.stringify(user));
      ok.textContent = '✅ Connexion réussie. Redirection...';
      ok.style.display = 'block';
      setTimeout(() => { window.location = 'store.html'; }, 700);
    } else {
      err.textContent = '✗ Email ou mot de passe incorrect.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }
  }, 300);
});

// Si déjà connecté, rediriger
if (sessionStorage.getItem('gv_session')) {
  window.location = 'store.html';
}
</script>
</body>
</html>
